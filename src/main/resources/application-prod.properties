# Used when SPRING_PROFILES_ACTIVE=prod (set in render.yaml).
# No fallback values for secrets: the app refuses to start if they are missing.

spring.datasource.url=jdbc:${DB_TYPE:postgresql}://${DB_HOST}:${DB_PORT}/${DB_NAME}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

app.jwt.secret=${JWT_SECRET}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Render terminates HTTPS at its proxy
server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
